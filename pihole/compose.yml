services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped

    ports:
      # DNS ports
      - "53:53/tcp"
      - "53:53/udp"
      # Web UI on HTTP
      - "8888:80/tcp"
      # HTTPS port from the original Pi-hole config
      - "8453:443/tcp"
      # Uncomment if using Pi-hole as your DHCP server
      # - "67:67/udp"
      # Uncomment if using Pi-hole as your NTP server
      - "123:123/udp"

    environment:
      TZ: "Asia/Kathmandu"
      FTLCONF_webserver_api_password: "EnterYourPasswordHere"
      # If using Docker's default bridge network, DNS listening mode should be set to ALL
      FTLCONF_dns_listeningMode: "ALL"

    volumes:
      - "./etc-pihole:/etc/pihole"
      - "./etc-dnsmasq.d:/etc/dnsmasq.d"

    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE

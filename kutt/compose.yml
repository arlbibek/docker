services:
  server:
    build:
      context: .
    container_name: kutt-db
    volumes:
      - ./db_data_sqlite:/var/lib/kutt
      - ./custom:/kutt/custom
    environment:
      DB_FILENAME: "/var/lib/kutt/data.sqlite"
      REDIS_ENABLED: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - 3011:3000
    depends_on:
      redis:
        condition: service_started
  redis:
    image: redis:alpine
    container_name: kutt-db
    restart: always
    expose:
      - 6379
